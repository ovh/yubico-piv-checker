name: Go
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
      - name: Build
        run: go build -v ./cmd/yubico-piv-checker
      - name: Test
        run: go test -v ./...